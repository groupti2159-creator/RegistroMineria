[pytest]
testpaths = tests
addopts = -v --html=tests/reporte.html --self-contained-html
markers =
    smoke: pruebas rápidas de humo (todas las páginas principales)
    compromisos: pruebas del módulo Compromisos
    aguas: pruebas del módulo Gestión de Aguas
    desvios: pruebas del módulo Desvíos Ambientales
    residuos: pruebas del módulo Gestión de Residuos
    meteorologia: pruebas del módulo Meteorología
    configuracion: pruebas del módulo Configuración