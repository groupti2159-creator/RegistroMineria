<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ecoSupervisor — Iniciar Sesión</title>
<link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body class="login-body">
  <button class="dark-toggle-login" onclick="toggleDark()" title="Modo oscuro">🌙</button>

  <div class="login-wrapper">
    <div class="login-card">
      <div class="login-logo">
        <div class="logo-icon">🌍</div>
      </div>
      <h1 class="login-title"><span>eco</span>Supervisor</h1>
      <p class="login-subtitle">+ Monitoreo Ambiental</p>

      {% if error %}
      <div class="alert alert-error" style="margin-bottom:1rem">
        <span>❌ {{ error }}</span>
      </div>
      {% endif %}

      <form method="POST" action="{{ url_for('auth.login') }}">
        <div class="form-group">
          <label class="form-label">🪪 DNI</label>
          <div class="input-wrapper">
            <span class="input-icon">🪪</span>
            <input type="text" name="dni" class="form-input" placeholder="Ingresa tu DNI (8 dígitos)" maxlength="8" required>
          </div>
        </div>
        <div class="form-group">
          <label class="form-label">🔒 Contraseña</label>
          <div class="input-wrapper">
            <span class="input-icon">🔒</span>
            <input type="password" name="password" class="form-input" placeholder="Ingresa tu contraseña" required>
          </div>
        </div>
        <button type="submit" class="btn btn-primary btn-block">Iniciar Sesión →</button>
      </form>
      <p class="login-footer">🔗 ecoSupervisor - Sistema de Monitoreo Ambiental</p>
    </div>
  </div>
  <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
