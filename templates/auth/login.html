<!DOCTYPE html>
<html lang="es" data-theme="light">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ecoSupervisor — Iniciar Sesión</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/base.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/dark_mode.css') }}">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap"
    rel="stylesheet">
  <script src="https://unpkg.com/feather-icons"></script>
</head>

<body class="login-body">
  <button class="dark-toggle-login" onclick="toggleDark()" title="Cambiar tema">
    <i data-feather="moon"></i>
  </button>

  <div class="login-wrapper">
    <div class="login-card">
      <div class="login-logo">
        <div class="logo-icon">
          <i data-feather="globe"></i>
        </div>
      </div>
      <h1 class="login-title"><span class="title-eco">Eco</span><span class="title-sup">Supervisor</span></h1>
      <p class="login-subtitle">Sistema de Monitoreo Ambiental</p>

      {% if error %}
      <div class="alert alert-error" style="margin-bottom:1rem">
        <span>
          <i data-feather="alert-circle"></i>
          {{ error }}
        </span>
      </div>
      {% endif %}

      <form method="POST" action="{{ url_for('auth.login') }}" class="login-form">
        <div class="form-group">
          <label class="form-label">
            <i data-feather="credit-card"></i>
            DNI
          </label>
          <div class="input-wrapper">
            <span class="input-icon"><i data-feather="credit-card"></i></span>
            <input type="text" name="dni" class="form-input" placeholder="Ingresa tu DNI (8 dígitos)" maxlength="8"
              required autocomplete="username">
          </div>
        </div>
        <div class="form-group">
          <label class="form-label">
            <i data-feather="lock"></i>
            Contraseña
          </label>
          <div class="input-wrapper">
            <span class="input-icon"><i data-feather="lock"></i></span>
            <input type="password" name="password" class="form-input" placeholder="Ingresa tu contraseña" required
              autocomplete="current-password">
          </div>
        </div>
        
        <button type="submit" class="btn btn-primary btn-block btn-lg">
          <i data-feather="log-in"></i>
          Iniciar Sesión
        </button>
      </form>

      <div class="login-footer">
        <i data-feather="shield"></i>
        <span>ecoSupervisor - Sistema de Monitoreo Ambiental</span>
      </div>
    </div>
  </div>

  <script src="{{ url_for('static', filename='js/main.js') }}"></script>
  <script>
    // Inicializar iconos Feather
    feather.replace({ 'stroke-width': 1.2 });

    // Actualizar icono del botón de tema según el tema actual
    document.addEventListener('DOMContentLoaded', function () {
      const theme = localStorage.getItem('theme') || 'light';
      const toggleBtn = document.querySelector('.dark-toggle-login');
      if (theme === 'dark' && toggleBtn) {
        toggleBtn.innerHTML = '<i data-feather="sun"></i>';
        feather.replace({ 'stroke-width': 1.2 });
      }
    });

    // Actualizar icono al cambiar tema
    const originalToggleDark = window.toggleDark;
    window.toggleDark = function () {
      originalToggleDark();
      const theme = document.documentElement.getAttribute('data-theme');
      const toggleBtn = document.querySelector('.dark-toggle-login');
      if (toggleBtn) {
        toggleBtn.innerHTML = theme === 'dark' ? '<i data-feather="sun"></i>' : '<i data-feather="moon"></i>';
        feather.replace({ 'stroke-width': 1.2 });
      }
    };
  </script>
</body>

</html>
