<div style="display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:60vh;text-align:center;gap:1.5rem">
  <div style="width:80px;height:80px;border-radius:50%;background:linear-gradient(135deg,#1a7a3c,#2ecc71);display:flex;align-items:center;justify-content:center">
    <i data-feather="{{ icono|default('box') }}" style="width:36px;height:36px;color:#fff"></i>
  </div>
  <h2 style="font-size:1.6rem;font-weight:700;color:var(--text-primary)">{{ titulo|default('Módulo') }}</h2>
  <p style="color:var(--text-secondary);max-width:400px">Este módulo está en desarrollo. Pronto estará disponible.</p>
  <span style="background:#f0f9f4;color:#1a7a3c;padding:.4rem 1rem;border-radius:999px;font-size:.8rem;font-weight:600;border:1px solid #c3e6cb">
    <i data-feather="tool" style="width:12px;height:12px;vertical-align:middle;margin-right:4px"></i> En construcción
  </span>
</div>
